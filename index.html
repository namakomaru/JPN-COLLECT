<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPN COLLECT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans JP", sans-serif;
      background: #0b0d12;
      color: white;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #262a33;
      background: #11141b;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .sub {
      color: #9da5b4;
      margin-top: 6px;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .hero {
      text-align: center;
      padding: 45px 10px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 64px);
      margin: 0 0 15px;
    }

    .hero p {
      color: #aeb6c5;
      font-size: 18px;
    }

    .search {
      max-width: 650px;
      margin: 30px auto;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #333946;
      background: #151922;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 16px 22px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      margin-top: 55px;
      margin-bottom: 20px;
      font-size: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: #141821;
      border: 1px solid #272c36;
      border-radius: 15px;
      overflow: hidden;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #555e70;
    }

    .image {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg,#252b38,#11141b);
      font-size: 50px;
    }

    .info {
      padding: 16px;
    }

    .name {
      font-weight: bold;
      font-size: 18px;
    }

    .meta {
      color: #939cab;
      margin-top: 7px;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #747d8c;
      padding: 50px 20px;
    }

    @media(max-width:600px){
      .search {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">JPN COLLECT</div>
  <div class="sub">Discover Japan. Collect the culture.</div>
</header>

<main>

  <section class="hero">
    <h1>DISCOVER JAPAN</h1>
    <p>日本のカルチャー・場所・食・体験を世界へ。</p>

    <div class="search">
      <input id="searchInput" type="text" placeholder="Search Japan...">
      <button onclick="searchItems()">SEARCH</button>
    </div>
  </section>

  <h2 class="section-title">Explore Japan</h2>

  <div class="grid" id="cards">

    <div class="card" data-name="Tokyo">
      <div class="image">🗼</div>
      <div class="info">
        <div class="name">Tokyo</div>
        <div class="meta">City / Culture</div>
      </div>
    </div>

    <div class="card" data-name="Japanese Food Sushi Ramen">
      <div class="image">🍣</div>
      <div class="info">
        <div class="name">Japanese Food</div>
        <div class="meta">Sushi / Ramen / Local Food</div>
      </div>
    </div>

    <div class="card" data-name="Anime Manga">
      <div class="image">🎌</div>
      <div class="info">
        <div class="name">Anime & Manga</div>
        <div class="meta">Japanese Pop Culture</div>
      </div>
    </div>

    <div class="card" data-name="Kyoto Temple">
      <div class="image">⛩️</div>
      <div class="info">
        <div class="name">Kyoto</div>
        <div class="meta">Tradition / Temples</div>
      </div>
    </div>

  </div>

</main>

<footer>
  JPN COLLECT — Japan for the world.
</footer>

<script>
function searchItems() {
  const value = document.getElementById("searchInput").value.toLowerCase();
  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    const name = card.dataset.name.toLowerCase();

    if (name.includes(value)) {
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>

</body>
</html>
